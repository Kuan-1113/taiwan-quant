name: 每日台股掃描 17:00

on:
  schedule:
    - cron: '0 9 * * 1-5'   # UTC 09:00 = 台灣 17:00，週一到週五
  workflow_dispatch:          # 允許手動觸發（測試用）

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          DISCORD_WEBHOOK_SIGNAL: ${{ secrets.DISCORD_WEBHOOK_SIGNAL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCAN_MARKET: both
          MAX_WORKERS: "20"
          MIN_AVG_VOLUME: "1000"
          SCHEDULE_TIME: "17:00"
          TIMEZONE: Asia/Taipei
          ADX_TREND_THRESHOLD: "25"
          SCORE_THREE_STAR: "80"
          SCORE_TWO_STAR: "60"
          SCORE_ONE_STAR: "40"
          TRACKER_MIN_STARS: "1"
        run: python -X utf8 main.py --now

      - name: Commit DB back to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add taiwan_signals.db
          git diff --cached --quiet || git commit -m "data: 更新信號追蹤資料庫 $(date +'%Y-%m-%d')"
          git push
